name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please attach logs from the console (`logs/bot.log`) when possible —
        remove tokens and QQ numbers you do not want to share.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. start the bot with ...
        2. send `@bot 你好` in a group
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD`, or the version shown in the WebUI footer.
  - type: dropdown
    id: model-source
    attributes:
      label: Model source
      options:
        - ollama (local)
        - LM Studio / OpenAI-compatible
        - Remote API (DeepSeek, OneAPI, ...)
        - Not related to the model
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
