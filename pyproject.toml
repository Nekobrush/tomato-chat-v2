[project]
name = "tomato-chat"
dynamic = ["version"]
description = "QQ 群猫娘聊天机器人：NoneBot2 + ollama / OpenAI 兼容 API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nekobrush" }]
license = { text = "MIT" }
keywords = ["nonebot2", "onebot", "qq", "chatbot", "ollama", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: NoneBot",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "nonebot2[fastapi,httpx,websockets]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "ollama>=0.6.3",
    "emoji>=2.16.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "pytest-asyncio>=1.0", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/Nekobrush/tomato-chat-v2"
Issues = "https://github.com/Nekobrush/tomato-chat-v2/issues"
Changelog = "https://github.com/Nekobrush/tomato-chat-v2/blob/main/CHANGELOG.md"

[project.scripts]
tomato-chat = "launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["launcher", "main"]

[tool.setuptools.packages.find]
include = ["bot_plugins*", "webui*"]

[tool.setuptools.package-data]
webui = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "bot_plugins.ai_chat._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "data", "logs", "GPT-Speak-main"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
